name: Test and Report Workflow

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG Suite XML file (e.g. testNG-smoke.xml, testNG-regression.xml, testNG-device-management.xml, testNG-user-admin.xml, testNG-api.xml)'
        required: false
        default: 'testNG.xml'
      project:
        description: 'Project profile (sampark, lct, trio, atcu, swaraj)'
        required: false
        default: 'sampark'
      marker:
        description: 'TestNG group/marker expression (e.g. smoke, regression)'
        required: false
      threads:
        description: 'Number of parallel threads (e.g. 1 for single-thread, 4 for multi-thread)'
        required: false
        default: '4'
      parallel:
        description: 'Parallel mode (classes, methods, none)'
        required: false
        default: 'classes'
      report_dir:
        description: 'Base report output directory'
        required: false
        default: 'Reports'
  repository_dispatch:
    types:
      - run-project-report

env:
  REPORT_DIR: ${{ github.workspace }}/Reports

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    env:
      HEADLESS: 'true'
      SUITE_INPUT: ${{ github.event.inputs.suite }}
      PROJECT_INPUT: ${{ github.event.inputs.project }}
      MARKER_INPUT: ${{ github.event.inputs.marker }}
      THREADS_INPUT: ${{ github.event.inputs.threads }}
      PARALLEL_INPUT: ${{ github.event.inputs.parallel }}
      REPORT_DIR_INPUT: ${{ github.event.inputs.report_dir }}
      TARGET_REPORT_DIR: ${{ github.event.client_payload.report_dir || github.event.inputs.report_dir || 'Reports' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 openpyxl pyyaml

      - name: Run tests and generate reports
        continue-on-error: true
        run: |
          EVENT_SUITE=${{ github.event.client_payload.suite || github.event.inputs.suite || 'testNG.xml' }}
          EVENT_PROJECT=${{ github.event.client_payload.project || github.event.inputs.project || 'sampark' }}
          EVENT_MARKER=${{ github.event.client_payload.marker || github.event.inputs.marker || '' }}
          EVENT_THREADS=${{ github.event.client_payload.threads || github.event.inputs.threads || '4' }}
          EVENT_PARALLEL=${{ github.event.client_payload.parallel || github.event.inputs.parallel || 'classes' }}

          TARGET_REPORT_DIR=${{ env.TARGET_REPORT_DIR }}
          ARGS="--report-dir \"$TARGET_REPORT_DIR\""

          if [ -n "$EVENT_SUITE" ]; then
            ARGS="$ARGS --suite \"$EVENT_SUITE\""
          fi

          if [ -n "$EVENT_PROJECT" ]; then
            ARGS="$ARGS --project \"$EVENT_PROJECT\""
          fi

          if [ -n "$EVENT_MARKER" ]; then
            ARGS="$ARGS --marker \"$EVENT_MARKER\""
          fi

          if [ -n "$EVENT_THREADS" ]; then
            ARGS="$ARGS --threads $EVENT_THREADS"
          fi

          if [ -n "$EVENT_PARALLEL" ]; then
            ARGS="$ARGS --parallel $EVENT_PARALLEL"
          fi

          echo "Executing: python generate_reports.py $ARGS"
          eval python generate_reports.py $ARGS

      - name: Verify generated reports
        run: |
          echo "Checking for report files..."
          REPORT_FILES=$(find "${{ env.TARGET_REPORT_DIR }}" -type f \( -name 'report.html' -o -name 'report.xlsx' \) | sort)
          echo "$REPORT_FILES"
          if [ -z "$REPORT_FILES" ]; then
            echo "No generated report files found"
            exit 1
          fi

      - name: Resolve report attachments
        id: report_attachments
        if: always()
        shell: bash
        run: |
          set -e
          BASE_DIR="${{ env.TARGET_REPORT_DIR }}"
          if [ ! -d "$BASE_DIR" ]; then
            echo "Report directory not found: $BASE_DIR"
            exit 0
          fi

          mapfile -t ATTACHMENTS < <(find "$BASE_DIR" -type f \( -name 'report.html' -o -name 'report.xlsx' \) | sort)
          if [ ${#ATTACHMENTS[@]} -eq 0 ]; then
            echo "No report attachments found"
            exit 0
          fi

          printf '%s\n' "${ATTACHMENTS[@]}" > attachment_paths.txt
          echo "attachments<<EOF" >> "$GITHUB_OUTPUT"
          cat attachment_paths.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "Resolved report attachments:"
          cat attachment_paths.txt

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: ${{ env.TARGET_REPORT_DIR }}

      - name: Send Execution Report Email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          secure: true
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            [CI/CD Notice] Test Execution Report: ${{ github.repository }} | Branch: ${{ github.ref_name }} (Run #${{ github.run_number }})
          body: |
            Dear Team,

            Please find below the automated test execution summary for the latest continuous integration run.

            Execution Details:
            --------------------------------------------------
            Repository:      ${{ github.repository }}
            Branch/Ref:      ${{ github.ref_name }}
            Workflow:        ${{ github.workflow }}
            Run Number:      #${{ github.run_number }}

            The comprehensive analysis files have been generated and successfully attached to this transmission:
            - Execution Overview (HTML)
            - Detailed Test Metrics (XLSX)

            For full logs and historical data, please review the workflow run directly on GitHub.

            Sincerely,
            Automated CI/CD Notification System
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          attachments: ${{ steps.report_attachments.outputs.attachments }}
